name: Desktop builds

on:
  push:
    # Only real version tags (v1.2.1). A loose "v*" also matched a renamed
    # archive tag (v1.2.0-archive), rebuilt it, and overwrote its assets,
    # which reset their download counts.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

# tauri-action needs to create the release and upload assets
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 (Intel) runners are retired; macos-15-intel is
          # GitHub's supported Intel label
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ffarch: amd64
            extra: --config src-tauri/release-signing-macos.json
          # macos-14 is being retired (brownouts from Oct 2026); macos-15 is
          # also Apple Silicon
          - os: macos-15
            target: aarch64-apple-darwin
            ffarch: arm64
            extra: --config src-tauri/release-signing-macos.json
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extra: --config src-tauri/release-signing.json

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller opencv-python-headless
        shell: bash

      - name: Download AI models
        run: |
          mkdir -p static/models
          curl -L -o static/models/realesr-general-x4v3.onnx \
            "https://huggingface.co/OwlMaster/AllFilesRope/resolve/main/realesr-general-x4v3.onnx"
          curl -L -o static/models/face_detection_yunet_2023mar.onnx \
            "https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
        shell: bash

      - name: Build Python sidecar (PyInstaller)
        run: pyinstaller nextgenup-server.spec
        shell: bash

      - name: Stage sidecar binary
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/nextgenup-server.exe "src-tauri/binaries/nextgenup-server-${{ matrix.target }}.exe"
          else
            cp dist/nextgenup-server "src-tauri/binaries/nextgenup-server-${{ matrix.target }}"
            chmod +x "src-tauri/binaries/nextgenup-server-${{ matrix.target }}"
          fi
        shell: bash

      - name: Download FFmpeg (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          curl -L -o /tmp/ffmpeg.zip  "https://ffmpeg.martin-riedl.de/redirect/latest/macos/${{ matrix.ffarch }}/release/ffmpeg.zip"
          curl -L -o /tmp/ffprobe.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/${{ matrix.ffarch }}/release/ffprobe.zip"
          unzip -o /tmp/ffmpeg.zip  -d /tmp/ff
          unzip -o /tmp/ffprobe.zip -d /tmp/ff
          cp /tmp/ff/ffmpeg  "src-tauri/binaries/ffmpeg-${{ matrix.target }}"
          cp /tmp/ff/ffprobe "src-tauri/binaries/ffprobe-${{ matrix.target }}"
          chmod +x src-tauri/binaries/ff*

      - name: Download FFmpeg (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          curl -L -o /tmp/ffmpeg.tar.xz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          FFDIR=$(find /tmp -maxdepth 1 -type d -name "ffmpeg-*-static" | head -1)
          # Prefixed names: deb/rpm install sidecars into /usr/bin, where a
          # plain "ffmpeg" collides with the distro package (issue #7).
          # tauri.linux.conf.json lists these names for Linux builds only.
          cp "$FFDIR/ffmpeg"  "src-tauri/binaries/nextgenup-ffmpeg-${{ matrix.target }}"
          cp "$FFDIR/ffprobe" "src-tauri/binaries/nextgenup-ffprobe-${{ matrix.target }}"
          chmod +x src-tauri/binaries/nextgenup-ff*

      - name: Download FFmpeg (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          curl -L --retry 4 -o ffmpeg.zip \
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          unzip -o -q ffmpeg.zip -d fftmp
          FFDIR=$(find fftmp -maxdepth 1 -type d -name "ffmpeg-*" | head -1)
          cp "$FFDIR/bin/ffmpeg.exe"  "src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe"
          cp "$FFDIR/bin/ffprobe.exe" "src-tauri/binaries/ffprobe-${{ matrix.target }}.exe"
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install
        shell: bash

      # Windows: Azure Artifact Signing (account matily-signing, profile
      # matily-public). src-tauri/release-signing.json wires the signing
      # command; it is only passed on CI, so local builds stay unsigned.
      - name: Install the Windows signing tool
        if: startsWith(matrix.os, 'windows')
        run: cargo install trusted-signing-cli --locked
        shell: bash

      # macOS: Developer ID signing and Apple notarization. The values are
      # forwarded only when the secrets exist (an empty APPLE_CERTIFICATE
      # would make the bundler fail instead of skipping signing).
      - name: Apple signing and notarization
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple signing secrets; the Mac build will not be notarized."
            exit 0
          fi
          # A pasted certificate may carry line breaks; base64 must not.
          cert=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d ' \r\n')
          echo "::add-mask::$cert"
          echo "APPLE_CERTIFICATE=$cert" >> "$GITHUB_ENV"
          for v in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s=%s\n' "$v" "$(printf '%s' "${!v}" | tr -d '\r\n')" >> "$GITHUB_ENV"
          done

      # Builds, signs updater packages, uploads installers to the release,
      # and maintains a merged cross-platform latest.json for auto-update.
      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # App registration allowed to sign with the matily-public profile
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('NextGenUp {0}', github.ref_name) || '' }}
          args: --target ${{ matrix.target }} ${{ matrix.extra }}

      - name: Upload artifacts (non-release runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: nextgenup-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi*
          if-no-files-found: warn

  # Runs once after every platform has uploaded (tag builds only): renames the
  # installers to OS-friendly names, moves auto-update packages to the
  # permanent `updater-packages` pre-release, drops .sig files (signatures
  # live inside latest.json) and rewrites latest.json to match.
  finalize:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tidy release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/finalize_release.py "${{ github.ref_name }}"
