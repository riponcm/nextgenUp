# =============================================================================
# Demerivo PixelFix — Production Multi-Container Orchestration (Docker Compose)
# =============================================================================

version: "3.8"

networks:
  frontend-net:
    driver: bridge
    internal: false
  backend-net:
    driver: bridge
    internal: true

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  certbot_www:
    driver: local

services:
  # ---------------------------------------------------------------------------
  # 1. Edge Gateway & Reverse Proxy (Nginx)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: demerivo-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - frontend-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ---------------------------------------------------------------------------
  # 2. FastAPI Application & Frontend Static Delivery
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: demerivo-api
    restart: always
    # Security: No host ports mapped directly. Only reachable via internal networks from Nginx.
    expose:
      - "8000"
    environment:
      - DEMERIVO_ENV=production
      - DEMERIVO_DEBUG=false
      - DEMERIVO_HOST=0.0.0.0
      - DEMERIVO_PORT=8000
      - DEMERIVO_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-demerivo_user}:${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-demerivo_db}
      - DEMERIVO_REDIS_URL=redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@redis:6379/0
      - DEMERIVO_QUEUE_BACKEND=redis
      - DEMERIVO_START_EMBEDDED_WORKERS=false
      - DEMERIVO_SUPABASE_URL=${DEMERIVO_SUPABASE_URL}
      - DEMERIVO_SUPABASE_ANON_KEY=${DEMERIVO_SUPABASE_ANON_KEY}
      - DEMERIVO_SUPABASE_JWT_SECRET=${DEMERIVO_SUPABASE_JWT_SECRET}
      - DEMERIVO_ADMIN_SECRET_TOKEN=${DEMERIVO_ADMIN_SECRET_TOKEN}
      - DEMERIVO_ADMIN_EMAILS=${DEMERIVO_ADMIN_EMAILS:-admin@demerivo.com}
      - DEMERIVO_ADMIN_ENFORCE_NETWORK_ISOLATION=true
      - DEMERIVO_STORAGE_PROVIDER=${DEMERIVO_STORAGE_PROVIDER:-s3}
      - DEMERIVO_S3_ENDPOINT_URL=${DEMERIVO_S3_ENDPOINT_URL}
      - DEMERIVO_S3_BUCKET_NAME=${DEMERIVO_S3_BUCKET_NAME}
      - DEMERIVO_S3_ACCESS_KEY_ID=${DEMERIVO_S3_ACCESS_KEY_ID}
      - DEMERIVO_S3_SECRET_ACCESS_KEY=${DEMERIVO_S3_SECRET_ACCESS_KEY}
      - DEMERIVO_PAYMENT_PROVIDER=${DEMERIVO_PAYMENT_PROVIDER:-razorpay}
      - DEMERIVO_RAZORPAY_KEY_ID=${DEMERIVO_RAZORPAY_KEY_ID}
      - DEMERIVO_RAZORPAY_KEY_SECRET=${DEMERIVO_RAZORPAY_KEY_SECRET}
      - DEMERIVO_RAZORPAY_WEBHOOK_SECRET=${DEMERIVO_RAZORPAY_WEBHOOK_SECRET}
      - DEMERIVO_EMAIL_PROVIDER=${DEMERIVO_EMAIL_PROVIDER:-smtp}
      - DEMERIVO_SMTP_HOST=${DEMERIVO_SMTP_HOST}
      - DEMERIVO_SMTP_PORT=${DEMERIVO_SMTP_PORT:-587}
      - DEMERIVO_SMTP_USER=${DEMERIVO_SMTP_USER}
      - DEMERIVO_SMTP_PASSWORD=${DEMERIVO_SMTP_PASSWORD}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  # ---------------------------------------------------------------------------
  # 3. Dedicated CPU AI Background Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: demerivo-ai-worker
    restart: always
    environment:
      - DEMERIVO_ENV=production
      - DEMERIVO_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-demerivo_user}:${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-demerivo_db}
      - DEMERIVO_REDIS_URL=redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@redis:6379/0
      - DEMERIVO_QUEUE_BACKEND=redis
      - DEMERIVO_STORAGE_PROVIDER=${DEMERIVO_STORAGE_PROVIDER:-s3}
      - DEMERIVO_S3_ENDPOINT_URL=${DEMERIVO_S3_ENDPOINT_URL}
      - DEMERIVO_S3_BUCKET_NAME=${DEMERIVO_S3_BUCKET_NAME}
      - DEMERIVO_S3_ACCESS_KEY_ID=${DEMERIVO_S3_ACCESS_KEY_ID}
      - DEMERIVO_S3_SECRET_ACCESS_KEY=${DEMERIVO_S3_SECRET_ACCESS_KEY}
      - DEMERIVO_MAX_CONCURRENT_WORKERS=2
      - DEMERIVO_JOB_TIMEOUT_SECONDS=600
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'demerivo.workers.runner' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3072M

  # ---------------------------------------------------------------------------
  # 4. Redis Task Queue & Rate Limiter
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: demerivo-redis
    restart: always
    # Security: No ports published to host; accessible only within backend-net
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ---------------------------------------------------------------------------
  # 5. PostgreSQL Database (Multi-Tenant & Accounting Store)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: demerivo-postgres
    restart: always
    # Security: No ports published to host; accessible only within backend-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-demerivo_db}
      POSTGRES_USER: ${POSTGRES_USER:-demerivo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demerivo_user} -d ${POSTGRES_DB:-demerivo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
