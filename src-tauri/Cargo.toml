[package]
name = "nextgenup"
version = "1.0.0"
description = "NextGenUp — AI image & video upscaling"
authors = ["Ripon Chandra Malo"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
