# =============================================================================
# Demerivo PixelFix — Production Nginx Gateway & Reverse Proxy Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# 1. HTTP Server — Enforce HTTPS Redirection
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name demerivo.com app.demerivo.com localhost;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 2. HTTPS Server — Secure Production Gateway
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demerivo.com app.demerivo.com localhost;

    # SSL / TLS Certificate Configuration
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Comprehensive Production Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:;" always;

    # Upload buffer & file size limits (50 MB max for high-resolution images)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Proxy timeouts accommodating CPU inference durations
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Common Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite untrusted client forwarding headers with verified TCP connection IP
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -------------------------------------------------------------------------
    # Health Probes (Direct passthrough for container orchestrators)
    # -------------------------------------------------------------------------
    location = /healthz {
        proxy_pass http://fastapi_backend/healthz;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://fastapi_backend/readyz;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Authentication Endpoints (Stricter Rate Limiting)
    # -------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://fastapi_backend/api/v1/auth/;
    }

    # -------------------------------------------------------------------------
    # Administrative Endpoints Isolation (Finding H-2 Resolution)
    # -------------------------------------------------------------------------
    # Restricts privileged /api/v1/admin/* routes exclusively to trusted networks.
    # External public internet traffic is dropped with HTTP 403 Forbidden.
    location /api/v1/admin/ {
        # Allow Loopback
        allow 127.0.0.1;
        allow ::1;

        # Allow Internal Corporate / WireGuard / Tailscale VPN CIDR blocks
        allow 10.0.0.0/8;        # Internal Cloud VPC / Management VPN
        allow 172.16.0.0/12;     # Docker internal bridge network
        allow 192.168.0.0/16;    # On-premise corporate office subnet

        # Drop all other public inbound traffic
        deny all;

        proxy_pass http://fastapi_backend/api/v1/admin/;
    }

    # -------------------------------------------------------------------------
    # Standard Public API Endpoints
    # -------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://fastapi_backend/api/;
    }

    # -------------------------------------------------------------------------
    # Frontend SPA Delivery
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://fastapi_backend/;
        # Static asset caching headers
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
            proxy_pass http://fastapi_backend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
